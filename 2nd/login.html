<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ミィナのWebサイト</title>

    <link rel="icon" type="image/x-icon" href="/miina_website/favicon.ico">
    <link rel="apple-touch-icon" href="/miina_website/favicon.ico">

    <!-- 2nd/login.html なので、ルートのstyle.cssを参照 -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- メニューボタン -->
    <button id="menuButton" class="menu-button" onclick="toggleMenu()">
        ☰ メニュー
    </button>

    <!-- 右側メニュー -->
    <nav id="sideMenu" class="side-menu">
        <h2>メニュー</h2>

        <a href="../">🏠 ホーム</a>
        <a href="dice.html">🎲 ダイス</a>
        <a href="member.html">🙍 バッチ取得者への待遇</a>
        <a href="materials.html">🖼 使用素材</a>
        <a href="business.html">💼 企業様への連絡</a>
    </nav>

    <!-- ログイン画面 -->
    <section class="content">
        <h2>🔐 ログイン</h2>

        <p>
            メールアドレスとパスワードを入力してください。
        </p>

        <div>
            <label for="email">メールアドレス</label><br>
            <input
                type="email"
                id="email"
                placeholder="example@example.com"
                autocomplete="email"
            >
        </div>

        <br>

        <div>
            <label for="password">パスワード</label><br>
            <input
                type="password"
                id="password"
                placeholder="パスワード"
                autocomplete="current-password"
            >
        </div>

        <br>

        <button id="loginButton" type="button">
            ログイン
        </button>

        <button id="signupButton" type="button">
            新規登録
        </button>

        <p id="authMessage"></p>
    </section>

    <script>
        /* =========================
           メニュー
           ========================= */

        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            menu.classList.toggle("open");
        }

        document.querySelectorAll("#sideMenu a").forEach(link => {
            link.addEventListener("click", function() {
                document.getElementById("sideMenu").classList.remove("open");
            });
        });
    </script>

    <!-- Supabase認証用スクリプト -->
    <!-- auth.jsを作成したあと、ここで読み込みます -->
    <script src="auth.js"></script>

</body>
</html>
