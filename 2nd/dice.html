<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイス - ミィナのWebサイト</title>
    <link rel="icon" type="image/x-icon" href="/miina_website/favicon.ico">
    <link rel="apple-touch-icon" href="/miina_website/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <style>
        .dice-history-section {
            position: relative;
        }

        .dice-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .dice-history-header h3 {
            margin: 0;
        }

        .clear-history-button {
            margin-left: auto;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- メニューボタン -->
<button id="menuButton" class="menu-button" onclick="toggleMenu()">
    ☰ メニュー
</button>

<!-- 右側メニュー -->
<nav id="sideMenu" class="side-menu">
    <h2>メニュー</h2>

    <a href="../">🏠 ホーム</a>
    <a href="dice.html">🎲 ダイス</a>
    <a href="member.html">🙍 バッチ取得者への待遇</a>
    <a href="materials.html">🖼 使用素材</a>
    <a href="business.html">💼 企業様への連絡</a>
</nav>

<section class="content">
    <h2>🎲 お遊び用ダイスロール</h2>

    <p>「2d6」や「2d6+6d8」のように入力してください。</p>

    <input type="text" id="diceInput" placeholder="例：2d6+6d8" value=""
           onkeydown="if (event.key === 'Enter') rollDice()">

    <button onclick="rollDice()">振る！</button>
    <button onclick="resetDice()">リセット</button>

    <div id="diceResult"></div>
</section>

<!-- ダイス結果ログ -->
<section class="content dice-history-section">
    <div class="dice-history-header">
        <h3>📜 ダイス結果ログ（最大10件）</h3>
        <button class="clear-history-button" onclick="clearDiceResults()">クリア</button>
    </div>
    <div id="diceResultHistory"></div>
</section>

<!-- ダイス式ログ -->
<section class="content dice-history-section">
    <div class="dice-history-header">
        <h3>🎲 ダイス式ログ（最大6件）</h3>
        <button class="clear-history-button" onclick="clearDiceHistory()">クリア</button>
    </div>
    <div id="diceHistory">
        <!-- JSON + Cookieからダイスボタンを自動生成 -->
    </div>
</section>

<script>
/* Cookie関連 */

function setCookie(name, value, days = 365) {
    const expires = new Date();
    expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);

    document.cookie =
        name + "=" + encodeURIComponent(value) +
        ";expires=" + expires.toUTCString() +
        ";path=/;SameSite=Lax";
}

function getCookie(name) {
    const cookies = document.cookie.split("; ");

    for (const cookie of cookies) {
        const separator = cookie.indexOf("=");

        if (separator === -1) {
            continue;
        }

        const key = cookie.substring(0, separator);
        const value = cookie.substring(separator + 1);

        if (key === name) {
            return decodeURIComponent(value);
        }
    }

    return null;
}

/* ダイス結果ログ 最大10件 */

function getDiceResults() {
    const cookie = getCookie("diceResults");

    if (!cookie) {
        return [];
    }

    try {
        const data = JSON.parse(cookie);
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error("ダイス結果ログの読み込みに失敗しました:", error);
        return [];
    }
}

function saveDiceResult(input, total) {
    let results = getDiceResults();

    const newResult = {
        expression: input,
        total: total
    };

    // 新しいものを先頭へ
    results.unshift(newResult);

    // 最大10件
    results = results.slice(0, 10);

    setCookie("diceResults", JSON.stringify(results));

    displayDiceResults();
}

function displayDiceResults() {
    const container = document.getElementById("diceResultHistory");
    container.innerHTML = "";

    const results = getDiceResults();

    results.forEach(item => {
        const button = document.createElement("button");

        button.textContent = `${item.expression} → ${item.total}`;

        // 結果ログを押すと、そのダイス式を入力欄へ入れる
        button.addEventListener("click", function() {
            document.getElementById("diceInput").value = item.expression;
        });

        container.appendChild(button);
    });
}

/* ダイス式ログ Cookie側は最大3件 JSON側の3件と合わせて最大6件 */

function getDiceHistory() {
    const cookie = getCookie("diceHistory");

    if (!cookie) {
        return [];
    }

    try {
        const data = JSON.parse(cookie);
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error("ダイス式ログの読み込みに失敗しました:", error);
        return [];
    }
}

function saveDiceHistory(input) {
    let history = getDiceHistory();

    // 同じダイス式があれば一旦削除
    history = history.filter(dice => dice !== input);

    // 新しいものを先頭へ
    history.unshift(input);

    // Cookie側は最大3件
    history = history.slice(0, 3);

    setCookie("diceHistory", JSON.stringify(history));

    loadDiceHistory();
}

/* JSON + Cookieのダイス式を表示 */

async function loadDiceHistory() {
    const historyContainer = document.getElementById("diceHistory");

    // 一旦表示を消す
    historyContainer.innerHTML = "";

    let jsonHistory = [];

    try {
        const response = await fetch("dicelog.json");

        if (!response.ok) {
            throw new Error("JSONの読み込みに失敗しました");
        }

        const data = await response.json();

        if (Array.isArray(data.history)) {
            jsonHistory = data.history;
        }
    } catch (error) {
        console.error("dicelog.jsonの読み込みに失敗しました:", error);
    }

    // Cookie側の履歴
    const cookieHistory = getDiceHistory();

    // JSONを優先し、重複を除いて最大6件
    const combinedHistory = [];

    for (const dice of jsonHistory) {
        if (!combinedHistory.includes(dice)) {
            combinedHistory.push(dice);
        }

        if (combinedHistory.length >= 6) {
            break;
        }
    }

    for (const dice of cookieHistory) {
        if (!combinedHistory.includes(dice)) {
            combinedHistory.push(dice);
        }

        if (combinedHistory.length >= 6) {
            break;
        }
    }

    // ボタンを作成
    combinedHistory.forEach(dice => {
        const button = document.createElement("button");

        button.textContent = dice;

        button.addEventListener("click", function() {
            document.getElementById("diceInput").value = dice;
        });

        historyContainer.appendChild(button);
    });
}

/* ダイスロール */

function rollDice() {
    const input = document.getElementById("diceInput").value.trim();
    const result = document.getElementById("diceResult");

    if (!input) {
        result.textContent = "ダイスを入力してください。";
        return;
    }

    const terms = input.split("+").map(term => term.trim());

    let total = 0;
    const details = [];

    for (const term of terms) {
        if (/^\d+$/.test(term)) {
            const value = Number(term);
            total += value;
            details.push(`<div class="dice-log">${value}</div>`);
            continue;
        }

        const match = term.match(/^(\d+)[dD](\d+)$/);

        if (!match) {
            result.textContent = `「${term}」の形式が正しくありません。`;
            return;
        }

        const diceCount = Number(match[1]);
        const diceSides = Number(match[2]);

        if (diceCount <= 0 || diceSides <= 0) {
            result.textContent = "1以上の数字を入力してください。";
            return;
        }

        if (diceCount > 100 || diceSides > 1000) {
            result.textContent = "ダイスの数は100個、面数は1000面までです。";
            return;
        }

        const rolls = [];

        for (let i = 0; i < diceCount; i++) {
            const roll = Math.floor(Math.random() * diceSides) + 1;
            rolls.push(roll);
        }

        const diceTotal = rolls.reduce((sum, value) => sum + value, 0);
        total += diceTotal;

        details.push(`
            <div class="dice-log">
                ${diceCount}d${diceSides}[${rolls.join(" + ")}]
            </div>
        `);
    }

    result.innerHTML = `
        ${details.join("")}
        <p><strong>合計：${total}</strong></p>
    `;

    // 正常にダイスを振り終わったあとでCookieへ保存
    saveDiceResult(input, total);
    saveDiceHistory(input);
}

/* 履歴クリア */

function clearDiceResults() {
    // ダイス結果ログのCookieを削除
    setCookie("diceResults", "", -1);
    displayDiceResults();
}

function clearDiceHistory() {
    // Cookie側のダイス式ログを削除
    setCookie("diceHistory", "", -1);
    loadDiceHistory();
}

/* リセット */

function resetDice() {
    document.getElementById("diceResult").innerHTML = "";
}

/* メニュー */

function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    menu.classList.toggle("open");
}

document.querySelectorAll("#sideMenu a").forEach(link => {
    link.addEventListener("click", function() {
        document.getElementById("sideMenu").classList.remove("open");
    });
});

/* ページ読み込み時 */

document.addEventListener("DOMContentLoaded", function() {
    displayDiceResults();
    loadDiceHistory();
});
</script>
<script src="./auth.js"></script>
</body>
</html>
